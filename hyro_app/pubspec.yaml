name: hyro_app
description: "Hyro - Study app with Pomodoro technique"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Auth & Backend
  supabase_flutter: ^2.8.4

  # UI & Design
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  fl_chart: ^0.70.2

  # Rive Animations
  rive: ^0.14.4

  # Google Sign In
  google_sign_in: ^6.2.1

  # Audio
  audioplayers: ^6.1.0

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  flutter_appauth: ^12.0.0
  provider: ^6.1.5+1
  crypto: ^3.0.7
  isar: 3.1.0
  isar_flutter_libs: 3.1.0
  path_provider: ^2.1.5
  window_manager: ^0.5.1
  app_links: ^6.4.1
  windows_single_instance: ^1.1.0
  file_picker: ^8.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  permission_handler: ^12.0.1
  system_tray: ^0.1.1
  tray_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: 2.4.13
  isar_generator: 3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/mascot/
    - assets/store/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
