name: hyro_app
description: "Hyro - Study app with Pomodoro technique"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Auth & Backend
  supabase_flutter: ^2.8.4

  # UI & Design
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  fl_chart: ^0.70.2

  # Rive Animations
  rive: ^0.14.4

  # Audio
  audioplayers: ^6.1.0

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  flutter_appauth: ^12.0.0
  provider: ^6.1.5+1
  crypto: ^3.0.7
  isar: 3.1.0
  isar_flutter_libs: 3.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: 2.4.13
  isar_generator: 3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/mascot/
